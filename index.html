      zip.file(path,b);imgPaths[im.id]=path}catch(e){fail++}}
  zip.file("data.json",JSON.stringify({format:"commission-backup",version:1,exportedAt:new Date().toISOString(),commissions:S.c,templates:S.t,settings:S.rawSettings||{},imgPaths},null,1));
  if(msg)msg.textContent="압축하는 중…";
  const blob=await zip.generateAsync({type:"blob",compression:"STORE"},m=>{if(msg)msg.textContent=`압축하는 중… ${Math.round(m.percent)}%`});
  if(msg)msg.textContent=`이미지 ${jobs.length-fail}장${fail?` (실패 ${fail}장)`:""} · ${(blob.size/1048576).toFixed(0)}MB`;
  await saveFile(`커미션_백업_${stamp()}.zip`,blob);btn.disabled=false;
}

/* ---------- stats ---------- */
function renderStats(){
  const done=S.c.filter(c=>DONE.has(c.status));
  const priced=done.filter(c=>recv(c)>0);
  const total=priced.reduce((a,c)=>a+net(c),0);
  const avg=priced.length?Math.round(priced.reduce((a,c)=>a+recv(c),0)/priced.length):null;
  const both=S.c.filter(c=>!CANCEL.has(c.status)&&recv(c)!=null&&c.quoteAfter!=null);
  const dOf=c=>c.quoteAfter-recv(c);
  const avgDiff=both.length?Math.round(both.reduce((a,c)=>a+dOf(c),0)/both.length):null;
  const sign=v=>v==null?"–":v===0?"±₩0":(v>0?"+":"−")+won(Math.abs(v));
  // monthly revenue by completion month, last 12 months that have data
  const by={};done.forEach(c=>{if(!c.doneDate)return;const k=c.doneDate.slice(0,7);(by[k]=by[k]||{v:0,n:0});by[k].v+=net(c);by[k].n++});
  const months=Object.keys(by).sort().slice(-12);
  // type table
  const T={};
  /* 타입 = ①심플 ~ ④번외; jobs without one are left out of the table */
  S.c.filter(c=>!CANCEL.has(c.status)&&c.subtype).forEach(c=>{(T[c.subtype]=T[c.subtype]||[]).push(c)});
  const avgOf=(arr,f)=>{const v=arr.map(f).filter(x=>x!=null&&!isNaN(x));return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null};
  const rows=Object.entries(T).map(([k,g])=>({k,n:g.length,b:avgOf(g,recv),a:avgOf(g,c=>c.quoteAfter),d:avgOf(g.filter(c=>recv(c)!=null&&c.quoteAfter!=null),dOf)})).sort((x,y)=>y.n-x.n);
  let h=`<div class="kpis">
    <div><small>누적 수익</small><b class="num">${won(total)}</b><span>상영 중 ${done.length}편 · 수수료 제외</span></div>
    <div><small>평균 단가</small><b class="num">${won(avg)}</b><span>가격 있는 ${priced.length}편 기준</span></div>
    <div><small>평균 차액</small><b class="num">${sign(avgDiff)}</b><span>작업 전 → 작업 후 · ${both.length}편</span></div></div>`;
  h+=`<h2 class="sec">월별 수익<span class="meta">완료일 기준 · 수수료 제외</span></h2>`;
  h+=months.length?`<div class="mchart" id="mchart">${monthChart(months.map(k=>({k,...by[k]})))}</div><div id="mlist"></div>`:`<div class="empty">완료일이 있는 작업이 아직 없어요.</div>`;
  if(!S.statMonth||!by[S.statMonth])S.statMonth=months[months.length-1];
  $("#view").innerHTML=h;wireChart();
}
function monthChart(data){
  const W=720,H=240,pl=8,pr=8,pt=26,pb=28;const max=Math.max(...data.map(d=>d.v),1);
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const m=max/p;return (m<=2?2:m<=5?5:10)*p})();
  const iw=W-pl-pr,ih=H-pt-pb,bw=Math.min(56,iw/data.length*.62),step=iw/data.length;
  const y=v=>pt+ih-(v/nice)*ih;
  const grid=[.5,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${y(nice*f)}" y2="${y(nice*f)}" class="g"/><text x="${pl}" y="${y(nice*f)-5}" class="gl">${won(nice*f)}</text>`).join("");
  const best=data.reduce((a,d)=>d.v>a.v?d:a,data[0]);
  const bars=data.map((d,i)=>{const x=pl+step*i+(step-bw)/2,top=y(d.v),hgt=Math.max(0,pt+ih-top),r=Math.min(4,bw/2,hgt);
    const path=hgt>0?`M${x},${pt+ih}V${top+r}Q${x},${top} ${x+r},${top}H${x+bw-r}Q${x+bw},${top} ${x+bw},${top+r}V${pt+ih}Z`:"";
    return `<g class="bar" data-i="${i}" data-k="${d.k}" role="button" tabindex="0" aria-label="${Number(d.k.slice(5))}월 작업 보기" data-tip="${Number(d.k.slice(5))}월 · ${won(d.v)} · ${d.n}편"><rect x="${pl+step*i}" y="${pt}" width="${step}" height="${ih}" fill="transparent"/>${path?`<path d="${path}"/>`:""}
      ${d===best?`<text x="${x+bw/2}" y="${top-6}" class="vl">${won(d.v)}</text>`:""}
      <text x="${x+bw/2}" y="${H-8}" class="xl">${d.k.slice(2,4)==="26"?Number(d.k.slice(5))+"월":d.k.slice(2).replace("-",".")}</text></g>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 수익 막대 그래프">${grid}<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" class="base"/>${bars}</svg><div class="tip" id="ctip" hidden></div>
  <details class="tblview"><summary>표로 보기</summary><table class="stbl"><thead><tr><th>월</th><th>수익</th><th>편수</th></tr></thead><tbody>${data.map(d=>`<tr data-k="${d.k}" class="mrow"><td>${d.k}</td><td class="num">${won(d.v)}</td><td class="num">${d.n}</td></tr>`).join("")}</tbody></table></details>`;
}
/* click a month (bar or table row) to list that month's finished commissions under the chart */
function showMonth(k){S.statMonth=k;const box=$("#mchart"),out=$("#mlist");if(!box||!out)return;
  box.querySelectorAll(".bar").forEach(g=>g.classList.toggle("sel",g.dataset.k===k));
  const g=S.c.filter(c=>DONE.has(c.status)&&(c.doneDate||"").startsWith(k)).sort((a,b)=>(b.doneDate>a.doneDate?1:b.doneDate<a.doneDate?-1:byDayOrder(a,b)));
  const tot=g.reduce((a,c)=>a+net(c),0);
  out.innerHTML=`<h2 class="sec">${Number(k.slice(5))}월 개봉작<span class="meta">${g.length}편 · 수익 <span class="num">${won(tot)}</span></span></h2>`+
    (g.length?`<div class="gal">${g.map(statTile).join("")}</div>`:`<div class="empty">이 달에 완료된 작업이 없어요.</div>`);if(g.length)layoutGal()}
const statTile=c=>{const id=cover(c);
  return `<div class="tile" role="button" tabindex="0" style="--r:${ratioOf(c,id)}" data-open="${c.id}" data-dk="${esc(c.doneDate||"")}">${id?`<img class="pic" draggable="false" data-aid="${id}" src="${imgSrc(thumbId(c,id))}" alt="${esc(c.nick)} 작업물" loading="lazy">`:`<span class="ph">${c.notionUrl?"노션에 보관 중":"이미지 없음"}</span>`}
  <span class="cap"><strong>${esc(c.nick)}</strong>${capLines(c,"done")}</span></div>`};
function wireChart(){const box=$("#mchart");if(!box)return;const tip=$("#ctip");
  box.querySelectorAll(".bar").forEach(g=>{g.addEventListener("click",()=>showMonth(g.dataset.k));g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();showMonth(g.dataset.k)}})});
  box.querySelectorAll(".mrow").forEach(r=>r.addEventListener("click",()=>showMonth(r.dataset.k)));
  if(S.statMonth)showMonth(S.statMonth);
  box.querySelectorAll(".bar").forEach(g=>{
    g.addEventListener("pointerenter",()=>{box.querySelectorAll(".bar").forEach(o=>o.classList.toggle("dim",o!==g));tip.textContent=g.dataset.tip;tip.hidden=false});
    g.addEventListener("pointermove",e=>{const r=box.getBoundingClientRect();tip.style.left=Math.min(r.width-tip.offsetWidth-4,Math.max(4,e.clientX-r.left-tip.offsetWidth/2))+"px";tip.style.top=(e.clientY-r.top-44)+"px"});
    g.addEventListener("pointerleave",()=>{box.querySelectorAll(".bar").forEach(o=>o.classList.remove("dim"));tip.hidden=true})})}


document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!ctxEl&&S.dismiss&&!e.target.closest?.("select")){e.preventDefault();S.dismiss()}});

/* poster cards: click a caption value to edit it in place (Enter/바깥 클릭 = 저장, Esc = 취소) */
document.addEventListener("click",e=>{const el=e.target.closest("[data-ed]");if(!el||el.querySelector("input,select"))return;
  const tile=el.closest("[data-open]");if(!tile)return;e.preventDefault();e.stopPropagation();
  const c=S.c.find(x=>x.id===tile.dataset.open);if(!c)return;const f=el.dataset.ed;
  const old=el.innerHTML;let input;
  if(f==="subtype"){input=document.createElement("select");input.innerHTML=SUBTYPES.map(o=>`<option value="${esc(o)}"${(c.subtype||"")===o?" selected":""}>${esc(o||"타입 없음")}</option>`).join("")}
  else if(f==="due"||f==="doneDate"){input=document.createElement("input");input.type="date";input.value=c[f]||""}
  else{input=document.createElement("input");input.inputMode="numeric";const v=f==="quoteBefore"?recv(c):c.quoteAfter;input.value=v!=null?Number(v).toLocaleString("ko-KR"):"";input.placeholder="₩";
    input.oninput=()=>{const x=input.value.replace(/[^\d]/g,"");input.value=x?Number(x).toLocaleString("ko-KR"):""}}
  input.className="inl";el.innerHTML="";el.appendChild(input);el.classList.add("editing");input.focus();if(input.select&&input.type!=="date")input.select();
  let done=false;
  const finish=async save=>{if(done)return;done=true;
    if(!save){el.innerHTML=old;el.classList.remove("editing");return}
    let v=input.value;const patch={};
    if(f==="quoteBefore"||f==="quoteAfter"){const x=v.replace(/[^\d]/g,"");v=x?Number(x):null;patch[f]=v;if(f==="quoteBefore")patch.price=v}
    else patch[f]=v;
    const cur=f==="quoteBefore"?recv(c):c[f]??(f==="subtype"?"":null);
    if((cur??"")===(v??"")){el.innerHTML=old;el.classList.remove("editing");return}
    try{await db.collection("commissions").doc(c.id).update(patch);toast("수정했어요")}catch(err){el.innerHTML=old;el.classList.remove("editing");toast("수정하지 못했어요")}};
  input.addEventListener("keydown",k=>{if(k.key==="Enter"){k.preventDefault();finish(true)}else if(k.key==="Escape"){k.preventDefault();k.stopPropagation();finish(false)}});
  input.addEventListener("blur",()=>finish(true));
  if(f==="subtype")input.addEventListener("change",()=>input.blur());
  input.addEventListener("click",k=>k.stopPropagation());
},true);
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches?.(".tile[data-open]")){e.preventDefault();openJob(e.target.dataset.open)}});

/* ---------- reorder within the same date (poster tab + calendar) ---------- */
/* mouse: press and drag; touch: hold ~0.4s, then drag. Only items with the same date can swap places. */
const byDayOrder=(a,b)=>(a.dayOrder??1e9)-(b.dayOrder??1e9);
let ro=null,suppressClick=false;
document.addEventListener("pointerdown",e=>{
  if(e.button!==0||document.querySelector(".scrim"))return;
  const it=e.target.closest(".tile[data-dk],.cal .items>button[data-dk]");if(!it||!it.dataset.dk)return;
  if(e.target.closest("[data-ed],input,select"))return;
  const box=it.parentElement;const peers=[...box.children].filter(x=>x.dataset.dk===it.dataset.dk);
  if(peers.length<2)return;
  ro={it,box,dk:it.dataset.dk,x:e.clientX,y:e.clientY,active:false,touch:e.pointerType!=="mouse",id:e.pointerId,timer:null};
  if(ro.touch)ro.timer=setTimeout(()=>{if(ro&&!ro.active)startRo()},400);
});
function startRo(){ro.active=true;ro.it.classList.add("reordering");document.body.classList.add("is-reordering");
  try{ro.it.setPointerCapture(ro.id)}catch(e){}
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}}
document.addEventListener("pointermove",e=>{if(!ro)return;
  const dist=Math.hypot(e.clientX-ro.x,e.clientY-ro.y);
  if(!ro.active){if(ro.touch){if(dist>8){clearTimeout(ro.timer);ro=null}return}if(dist<6)return;startRo()}
  e.preventDefault();
  const el=document.elementFromPoint(e.clientX,e.clientY);const over=el&&el.closest("[data-dk]");
  if(over&&over!==ro.it&&over.parentElement===ro.box&&over.dataset.dk===ro.dk){
    const r=over.getBoundingClientRect();const horiz=r.width>=r.height*.6&&ro.box.classList.contains("gal");
    const after=horiz?(e.clientX>r.left+r.width/2):(e.clientY>r.top+r.height/2);
    const ref=after?over.nextSibling:over;if(ref!==ro.it)ro.box.insertBefore(ro.it,ref);
    if(ro.box.classList.contains("gal"))layoutGal()}
},{passive:false});
async function endRo(){if(!ro)return;const r=ro;ro=null;clearTimeout(r.timer);
  if(!r.active)return;suppressClick=true;setTimeout(()=>suppressClick=false,0);
  r.it.classList.remove("reordering");document.body.classList.remove("is-reordering");
  const ids=[...r.box.children].filter(x=>x.dataset.dk===r.dk).map(x=>x.dataset.open);
  const writes=ids.map((id,i)=>({id,v:(i+1)*10})).filter(({id,v})=>{const c=S.c.find(x=>x.id===id);return c&&c.dayOrder!==v});
  if(!writes.length)return;
  writes.forEach(({id,v})=>{const c=S.c.find(x=>x.id===id);if(c)c.dayOrder=v});
  try{await Promise.all(writes.map(({id,v})=>db.collection("commissions").doc(id).update({dayOrder:v})));toast("순서를 바꿨어요")}
  catch(err){toast("순서를 저장하지 못했어요");render()}}
document.addEventListener("touchmove",e=>{if(ro&&ro.active)e.preventDefault()},{passive:false});
document.addEventListener("pointerup",endRo);document.addEventListener("pointercancel",endRo);
document.addEventListener("click",e=>{if(suppressClick){e.preventDefault();e.stopPropagation();suppressClick=false}},true);
document.addEventListener("contextmenu",e=>{if(ro&&ro.touch)e.preventDefault()},true);
/* ---------- right-click menu ---------- */
let ctxEl=null;
function closeCtx(){if(ctxEl){ctxEl.remove();ctxEl=null}}
function openCtx(x,y,title,items){
  closeCtx();ctxEl=document.createElement("div");ctxEl.className="ctx";ctxEl.setAttribute("role","menu");
  const paint=(html)=>{ctxEl.innerHTML=html;
    const r=ctxEl.getBoundingClientRect();
    ctxEl.style.left=Math.max(8,Math.min(x,innerWidth-r.width-8))+"px";
    ctxEl.style.top=Math.max(8,Math.min(y,innerHeight-r.height-8))+"px"};
  const main=()=>{paint(`<div class="t">${esc(title)}</div>${items.map((it,i)=>`<button type="button" role="menuitem" data-ci="${i}" class="${it.danger?"del":""}">${esc(it.label)}</button>`).join("")}`);
    ctxEl.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>{const it=items[+b.dataset.ci];
      if(it.confirm){paint(`<div class="q">${esc(it.confirm)}</div><div class="row"><button type="button" id="cNo">취소</button><button type="button" class="del" id="cYes">삭제</button></div>`);
        ctxEl.querySelector("#cNo").onclick=closeCtx;ctxEl.querySelector("#cYes").onclick=async()=>{closeCtx();await it.run()};ctxEl.querySelector("#cYes").focus()}
      else{closeCtx();it.run()}});
    const f=ctxEl.querySelector("button");if(f)f.focus()};
  document.body.appendChild(ctxEl);main();
}
document.addEventListener("contextmenu",e=>{
  if(e.target.closest("input,textarea,select"))return;
  const img=e.target.closest(".panel [data-view]");
  if(img){const fig=img.closest("figure");const rm=fig&&fig.querySelector("[data-rm]");
    e.preventDefault();
    openCtx(e.clientX,e.clientY,"이미지",[{label:"크게 보기",run:()=>img.click()},
      ...(rm?[{label:"이미지 삭제",danger:true,confirm:"이 이미지를 지울까요? 되돌릴 수 없어요.",run:async()=>{rm.click();const y=$("#rmYes");if(y)y.click()}}]:[])]);return}
  const o=e.target.closest("[data-open]");
  if(o&&!e.target.closest(".panel")){const c=S.c.find(x=>x.id===o.dataset.open);if(!c)return;e.preventDefault();
    const n=(c.images||[]).length;
    openCtx(e.clientX,e.clientY,c.nick,[{label:"열기",run:()=>openJob(c.id)},{label:"복제",run:()=>dupJob(c.id)},
      {label:"커미션 삭제",danger:true,confirm:`‘${c.nick}’ 커미션을 휴지통으로 옮길까요?${n?` 이미지 ${n}장은 그대로 보관돼요.`:""} 30일 안에는 되돌릴 수 있어요.`,run:()=>deleteJob(c)}]);return}
  const t=e.target.closest("[data-tpl]");
  if(t){const tp=S.t.find(x=>x.id===t.dataset.tpl);if(!tp)return;e.preventDefault();
    openCtx(e.clientX,e.clientY,tp.title,[{label:"수정",run:()=>openTpl(tp)},{label:"복제",run:()=>dupTpl(tp.id)},
      {label:"템플릿 삭제",danger:true,confirm:`‘${tp.title}’ 템플릿을 지울까요?`,run:async()=>{try{await db.collection("templates").doc(tp.id).delete();toast("지웠어요")}catch(err){toast("지우지 못했어요")}}}]);return}
});
function undoToast(m,fn){const t=document.createElement("div");t.className="toast undo";t.innerHTML=`<span>${esc(m)}</span><button type="button">되돌리기</button>`;
  document.body.appendChild(t);let done=false;const off=()=>{if(!done){done=true;t.remove()}};
  t.querySelector("button").onclick=async()=>{off();try{await fn()}catch(e){toast("되돌리지 못했어요")}};setTimeout(off,8000)}
const TRASH_DAYS=30;
async function trashJob(c){
  const d={...c};delete d.id;
  try{await db.collection("trash").doc(c.id).set({job:d,deletedAt:Date.now()});await db.collection("commissions").doc(c.id).delete();
    undoToast(`‘${c.nick}’ 커미션을 휴지통으로 옮겼어요`,()=>restoreJob(c.id,d));return true}
  catch(err){toast("지우지 못했어요. 다시 시도해 주세요");return false}}
async function restoreJob(id,d){if(!d){const t=(S.trash||[]).find(x=>x.id===id);if(!t)return;d=t.job}
  await db.collection("commissions").doc(id).set(d);await db.collection("trash").doc(id).delete();toast("되돌렸어요")}
async function purgeJob(t){const j=t.job||{};
  if(assets)for(const im of (j.images||[])){try{await assets.delete(im.id)}catch(err){}if(im.t)try{await assets.delete(im.t)}catch(err){}}
  await db.collection("trash").doc(t.id).delete()}
async function deleteJob(c){await trashJob(c)}
/* duplicate: all fields except images, completion date and day order; new turn number for the same client */
async function dupJob(id){const src=S.c.find(x=>x.id===id);if(!src)return;
  const d=structuredClone(src);delete d.id;delete d.dayOrder;d.images=[];d.doneDate="";d.order=Date.now();
  const cl=clientOf(src);d.client=cl;const others=clientJobs(cl);
  d.seq=others.reduce((a,x)=>Math.max(a,x.seq||1),0)+1;d.nick=labelFor(cl,d.seq,others.length+1);
  if(!ACTIVE.has(d.status))d.status=(S.statusDefs.find(x=>x.kind==="active")||{}).name||d.status;
  await saveDoc(d,true);if(d.id){toast(`‘${src.nick}’을(를) 복제했어요 · 이미지는 복제하지 않아요`);openJob(d.id)}}
async function dupTpl(id){const t=S.t.find(x=>x.id===id);if(!t)return;
  try{const nid="t"+Date.now().toString(36);await db.collection("templates").doc(nid).set({title:(t.title||"제목 없음")+" 복사",body:t.body||"",order:Date.now()});toast("복제했어요");close()}catch(e){toast("복제하지 못했어요")}}
document.addEventListener("click",e=>{if(ctxEl&&!e.target.closest(".ctx"))closeCtx()},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCtx()});
window.addEventListener("scroll",closeCtx,true);window.addEventListener("resize",closeCtx);
/* quick status change: tap the status pill on a row */
async function setStatus(c,st){const patch={status:st};if(DONE.has(st)&&!c.doneDate)patch.doneDate=iso(today());
  try{await db.collection("commissions").doc(c.id).update(patch);toast(`‘${c.nick}’ → ${st}`)}catch(e){toast("바꾸지 못했어요")}}
document.addEventListener("click",e=>{
  const p=e.target.closest(".job .st .pill");
  if(p&&!e.target.closest(".panel")){const j=p.closest("[data-open]");const c=j&&S.c.find(x=>x.id===j.dataset.open);
    if(c){e.stopPropagation();e.preventDefault();const r=p.getBoundingClientRect();
      openCtx(r.left,r.bottom+4,c.nick+" · 상태",STATUSES.map(st=>({label:(c.status===st?"✓ ":"　")+st,run:()=>setStatus(c,st)})));return}}
  const d=e.target.closest(".cal .d[data-day]");
  if(d&&!e.target.closest(".panel")){if(innerWidth>=600&&e.target.closest("[data-open]"))return;
    e.stopPropagation();e.preventDefault();openDay(d.dataset.day)}
},true);
function openDay(k){
  const list=S.c.filter(c=>!CANCEL.has(c.status)&&(DONE.has(c.status)&&c.doneDate?c.doneDate:c.due)===k).sort(byDayOrder);
  const dt=pd(k);const lbl=dt?`${dt.getMonth()+1}월 ${dt.getDate()}일`:k;
  shell(`<div class="bar"><h3>${lbl}</h3><button class="btn" type="button" id="x">닫기</button></div>
    ${list.length?`<div class="list">${list.map(jobRow).join("")}</div>`:`<div class="empty">이 날 일정이 없어요.</div>`}`);
  $("#x").onclick=()=>close();S.dismiss=()=>close();
  document.querySelectorAll(".panel [data-open]").forEach(b=>b.onclick=ev=>{if(ev.target.closest(".pill"))return;close();openJob(b.dataset.open)})}

/* ---------- boot ---------- */
(function(){const t=today();S.calY=t.getFullYear();S.calM=t.getMonth();const tab=load("tab");if(tab&&["list","cal","gal","tpl","stats"].includes(tab))S.tab=tab;const gv=load("galV");if(gv==="wip"||gv==="done")S.galV=gv;const lmo=load("listMode");if(lmo==="due"||lmo==="client")S.listMode=lmo;const gso=load("galSort");if(["time","price","type"].includes(gso))S.galSort=gso;render()})();
(async()=>{
  try{await standaloneInit()}catch(e){$("#view").innerHTML=`<div class="empty" style="margin-top:1.25rem">서버에 연결하지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>`;return}
  if(!db){$("#view").innerHTML=`<div class="empty" style="margin-top:1.25rem">저장소에 연결할 수 없어요. 로그인한 상태로 다시 열어 주세요.</div>`;return}
  let first=true;
  db.collection("commissions").onSnapshot(s=>{S.c=s.docs.map(d=>({id:d.id,...d.data()}));relabel();
    if(!document.querySelector(".scrim")||first)render();else renderHeader();if(first)setTimeout(backfillThumbs,4000);first=false},
    e=>{$("#view").innerHTML=`<div class="empty">목록을 불러오지 못했어요. 새로고침해 주세요.</div>`});
  db.collection("trash").onSnapshot(s=>{S.trash=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.deletedAt-a.deletedAt);
    const old=S.trash.filter(t=>Date.now()-t.deletedAt>TRASH_DAYS*864e5);old.forEach(t=>purgeJob(t).catch(()=>{}))},()=>{});
  db.collection("templates").orderBy("order").onSnapshot(s=>{S.t=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==="tpl"&&!document.querySelector(".scrim"))renderTpl()},()=>{});
  db.doc("settings/main").onSnapshot(s=>{const d=s.exists?s.data():{};S.rawSettings=d;S.settingsExists=s.exists;applyAppIcon(d.appIcon||"");setTheater(d.theater!==false);applyFont(d.font);applyTypes(d.types);applySources(d.sources);applyLogo(d.logo);S.slots=d.slots??null;applyTheme(d.accent,d.mode);applyStatusDefs(Array.isArray(d.statuses)&&d.statuses.length?d.statuses:STATUS_DEFS_DEFAULT.map(x=>({...x,color:(d.statusColors||{})[x.name]||x.color})));if(!document.querySelector(".scrim"))render();else renderHeader()},()=>{});
})();
